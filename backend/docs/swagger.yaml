        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
      security:
      - BearerAuth: []
      summary: 我发起的审核
      tags:
      - 工作流
  /api/v1/asset-workflow/multi-audit:
    post:
      consumes:
      - application/json
      parameters:
      - description: 批量审核参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_domain_workflow.multiAuditRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
      security:
      - BearerAuth: []
      summary: 批量审核
      tags:
      - 工作流
  /api/v1/asset-workflow/revoke:
    post:
      consumes:
      - application/json
      description: 撤回本人发起的未完成审核实例
      parameters:
      - description: 实例 ID 列表
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_domain_workflow.revokeRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
      security:
      - BearerAuth: []
      summary: 撤回审核
      tags:
      - 工作流
  /api/v1/asset-workflow/submit:
    post:
      consumes:
      - application/json
      description: 将媒资提交至指定流程定义，创建审核实例
      parameters:
      - description: 提交参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_domain_workflow.submitRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_domain_workflow.InstanceVO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
      security:
      - BearerAuth: []
      summary: 提交审核
      tags:
      - 工作流
  /api/v1/asset/{id}:
    delete:
      description: 软删除媒资（GORM DeletedAt）
      parameters:
      - description: 媒资 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
      security:
      - BearerAuth: []
      summary: 删除媒资
      tags:
      - 媒资
    get:
      parameters:
      - description: 媒资 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_asset.AssetVO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
      security:
      - BearerAuth: []
      summary: 获取媒资详情
      tags:
      - 媒资
    put:
      consumes:
      - application/json
      parameters:
      - description: 媒资 ID
        in: path
        name: id
        required: true
        type: string
      - description: 更新参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_domain_asset.updateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_asset.AssetVO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
      security:
      - BearerAuth: []
      summary: 更新媒资
      tags:
      - 媒资
