  /api/v1/asset/upload/chunk:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 上传会话 ID
        in: formData
        name: uploadId
        required: true
        type: string
      - description: 分片序号（从 0 开始）
        in: formData
        name: chunkIndex
        required: true
        type: integer
      - description: 分片二进制
        in: formData
        name: file
        required: true
        type: file
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
