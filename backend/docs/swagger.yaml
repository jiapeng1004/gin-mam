host: localhost:8080
info:
  contact: {}
  description: 媒资管理系统 REST API。成功响应直接返回业务 JSON（camelCase）；失败返回 { err_code, err_msg
    }。
  title: GIN-MAM API
  version: "1.0"
paths:
  /api/v1/asset:
    post:
      consumes:
      - application/json
      description: 直接创建媒资（已有 storagePath，非分片上传流程）
      parameters:
      - description: 媒资参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_domain_asset.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_domain_asset.AssetVO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
      security:
      - BearerAuth: []
      summary: 创建媒资
      tags:
      - 媒资
  /api/v1/asset-workflow/all:
    post:
      consumes:
      - application/json
      parameters:
      - description: 分页参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_domain_workflow.pageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_workflow.PageResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
      security:
      - BearerAuth: []
      summary: 全部审核实例
      tags:
      - 工作流
  /api/v1/asset-workflow/assigned-to-me:
    post:
      consumes:
      - application/json
      parameters:
      - description: 分页参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_domain_workflow.pageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_workflow.PageResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
      security:
      - BearerAuth: []
      summary: 待我审核列表
      tags:
      - 工作流
  /api/v1/asset-workflow/audit:
    post:
      consumes:
      - application/json
      description: 对单个流程实例执行通过或打回
      parameters:
      - description: 审核参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_domain_workflow.auditRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
      security:
      - BearerAuth: []
      summary: 审核实例
      tags:
      - 工作流
  /api/v1/asset-workflow/audited-by-me:
    post:
      consumes:
      - application/json
      parameters:
      - description: 分页参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_domain_workflow.pageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_domain_workflow.PageResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_gin-mam_backend_internal_pkg_httpx.ErrorVo'
      security:
      - BearerAuth: []
      summary: 我审过的
      tags:
      - 工作流
  /api/v1/asset-workflow/created-by-me:
    post:
      consumes:
      - application/json
      parameters:
      - description: 分页参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_domain_workflow.pageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
